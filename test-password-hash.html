<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Hash - Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Password Hash & Usuarios</h1>
        <p>Herramienta de diagnóstico para verificar el sistema de contraseñas</p>
        
        <div class="form-group">
            <label for="email">Email del usuario:</label>
            <input type="email" id="email" placeholder="ejemplo@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>
        
        <button onclick="testHash()">1️⃣ Test Hash (Crear hash de la contraseña)</button>
        <button onclick="testLogin()">2️⃣ Test Login (Verificar usuario completo)</button>
        <button onclick="listUsers()">3️⃣ Ver Usuarios en BD</button>
        <button onclick="verifyUserPassword()">4️⃣ Verificar Password del Usuario</button>
        
        <div id="result"></div>
    </div>

    <!-- Cargar bcrypt desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    
    <script>
        const SUPABASE_URL = 'https://lhjzxwthuqpqsvqpvsxw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxoanp4d3RodXFwcXN2cXB2c3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDM0MDAsImV4cCI6MjA4NTcxOTQwMH0.wIbgZgFqvZXB0T-pF01TwHak-m3ZcDFa2LTBOdhim3E';

        // Verificar que bcrypt se cargó
        window.addEventListener('load', () => {
            if (typeof bcrypt === 'undefined') {
                showResult('❌ ERROR: bcrypt no se cargó correctamente.\nRecarga la página.', 'error');
            } else {
                showResult('✅ Sistema listo. Ingresa email y contraseña, luego presiona un botón.', 'info');
            }
        });

        function showResult(message, type = 'info') {
            const div = document.getElementById('result');
            div.className = type;
            div.textContent = message;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        async function testHash() {
            const password = document.getElementById('password').value;
            
            console.log('testHash iniciado', { password: password ? '***' : '(vacío)' });
            
            if (!password) {
                showResult('❌ Por favor ingresa una contraseña', 'error');
                return;
            }

            showResult('🔄 Generando hash con bcrypt...\n(Esto puede tomar unos segundos)', 'info');

            try {
                console.log('Verificando bcrypt...');
                if (typeof bcrypt === 'undefined') {
                    throw new Error('bcrypt no está disponible');
                }
                
                console.log('Generando hash...');
                // Generar hash
                const hash = await bcrypt.hash(password, 10);
                console.log('Hash generado:', hash);
                
                console.log('Verificando hash...');
                // Verificar que el hash funcione
                const isValid = await bcrypt.compare(password, hash);
                console.log('Verificación resultado:', isValid);
                
                showResult(`✅ HASH GENERADO Y VERIFICADO!\n\n` +
                    `Contraseña original: ${password}\n` +
                    `Hash generado: ${hash}\n` +
                    `Longitud del hash: ${hash.length} caracteres\n\n` +
                    `✅ Verificación: ${isValid ? 'CORRECTA ✓' : 'FALLÓ ✗'}\n\n` +
                    `Este hash debería guardarse en password_hash`, 'success');
                    
            } catch (error) {
                console.error('Error en testHash:', error);
                showResult(`❌ Error al generar hash:\n\n${error.message}\n\nStack: ${error.stack}`, 'error');
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('testLogin iniciado', { email, password: password ? '***' : '(vacío)' });
            
            if (!email || !password) {
                showResult('❌ Por favor ingresa email y contraseña', 'error');
                return;
            }

            showResult('🔄 Paso 1/3: Buscando usuario en Supabase...', 'info');

            try {
                // Buscar usuario
                const url = `${SUPABASE_URL}/rest/v1/users?email=eq.${email}&select=*`;
                console.log('Fetching URL:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const users = await response.json();
                console.log('Usuarios encontrados:', users.length);
                
                showResult('🔄 Paso 2/3: Usuario encontrado, verificando contraseña...', 'info');
                
                if (!users || users.length === 0) {
                    showResult(`❌ USUARIO NO ENCONTRADO\n\n` +
                        `Email: ${email}\n\n` +
                        `Este usuario no existe en la base de datos.\n\n` +
                        `Posibles razones:\n` +
                        `1. El email está mal escrito\n` +
                        `2. El usuario no se registró aún\n` +
                        `3. Las políticas RLS están bloqueando la lectura`, 'error');
                    return;
                }

                const user = users[0];
                console.log('Usuario:', { ...user, password_hash: user.password_hash?.substring(0, 20) + '...' });
                
                showResult('🔄 Paso 3/3: Comparando hash con bcrypt...', 'info');
                
                // Verificar contraseña
                const passwordMatch = await bcrypt.compare(password, user.password_hash);
                console.log('Password match:', passwordMatch);
                
                if (passwordMatch) {
                    showResult(`✅ LOGIN EXITOSO!\n\n` +
                        `Usuario: ${user.name}\n` +
                        `Email: ${user.email}\n` +
                        `Role: ${user.role}\n` +
                        `ID: ${user.id}\n\n` +
                        `✅ La contraseña coincide perfectamente!\n` +
                        `El sistema de autenticación está funcionando bien.\n\n` +
                        `🎉 NO HAY NINGÚN PROBLEMA con tu autenticación.`, 'success');
                } else {
                    showResult(`❌ CONTRASEÑA INCORRECTA\n\n` +
                        `Usuario encontrado: ${user.name} (${user.email})\n` +
                        `Pero la contraseña NO coincide.\n\n` +
                        `Hash en BD (primeros 50 chars):\n${user.password_hash?.substring(0, 50)}...\n\n` +
                        `POSIBLES CAUSAS:\n` +
                        `1. ❌ La contraseña que ingresaste no es la correcta\n` +
                        `2. ❌ El hash en la BD está corrupto o incompleto\n` +
                        `3. ❌ La contraseña fue hasheada con otro método (no bcrypt)\n` +
                        `4. ❌ Hay espacios extra al inicio/fin de la contraseña\n\n` +
                        `SOLUCIÓN: Usa el Test 4 para ver más detalles del hash`, 'error');
                }
                
            } catch (error) {
                console.error('Error en testLogin:', error);
                showResult(`❌ Error al verificar login:\n\n${error.message}\n\nRevisa la consola del navegador (F12) para más detalles.`, 'error');
            }
        }

        async function listUsers() {
            showResult('🔄 Obteniendo lista de usuarios...', 'info');
            console.log('listUsers iniciado');

            try {
                const url = `${SUPABASE_URL}/rest/v1/users?select=id,email,name,role,password_hash&limit=20`;
                console.log('Fetching URL:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const users = await response.json();
                console.log('Usuarios obtenidos:', users.length);
                
                if (!users || users.length === 0) {
                    showResult(`⚠️ NO HAY USUARIOS EN LA BASE DE DATOS\n\n` +
                        `La tabla 'users' está vacía.\n\n` +
                        `Esto puede significar:\n` +
                        `1. No hay usuarios registrados aún\n` +
                        `2. Las políticas RLS están bloqueando la lectura`, 'info');
                    return;
                }

                let output = `✅ USUARIOS ENCONTRADOS: ${users.length}\n\n`;
                output += `═════════════════════════════════════\n\n`;
                
                users.forEach((user, i) => {
                    output += `${i + 1}. ${user.name || 'Sin nombre'}\n`;
                    output += `   Email: ${user.email}\n`;
                    output += `   Role: ${user.role || 'N/A'}\n`;
                    output += `   ID: ${user.id}\n`;
                    output += `   Hash length: ${user.password_hash?.length || 0} chars\n`;
                    
                    if (user.password_hash) {
                        const isValidBcrypt = user.password_hash.startsWith('$2a$') || 
                                            user.password_hash.startsWith('$2b$') || 
                                            user.password_hash.startsWith('$2y$');
                        output += `   Hash tipo: ${isValidBcrypt ? '✅ bcrypt' : '❌ NO bcrypt'}\n`;
                        output += `   Hash preview: ${user.password_hash.substring(0, 40)}...\n`;
                    } else {
                        output += `   ⚠️ NO TIENE HASH (password_hash es null)\n`;
                    }
                    
                    output += `\n`;
                });
                
                output += `═════════════════════════════════════\n\n`;
                output += `💡 Tip: Los hashes bcrypt válidos empiezan con $2a$, $2b$ o $2y$`;
                
                showResult(output, 'success');
                
            } catch (error) {
                console.error('Error en listUsers:', error);
                showResult(`❌ Error al obtener usuarios:\n\n${error.message}\n\nRevisa la consola del navegador (F12) para más detalles.`, 'error');
            }
        }

        async function verifyUserPassword() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('verifyUserPassword iniciado', { email, password: password ? '***' : '(vacío)' });
            
            if (!email || !password) {
                showResult('❌ Por favor ingresa email y contraseña', 'error');
                return;
            }

            showResult('🔄 Paso 1/4: Buscando usuario...', 'info');

            try {
                // Buscar usuario
                const url = `${SUPABASE_URL}/rest/v1/users?email=eq.${email}&select=*`;
                console.log('Fetching URL:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                const users = await response.json();
                
                if (!users || users.length === 0) {
                    showResult(`❌ Usuario no encontrado: ${email}`, 'error');
                    return;
                }

                const user = users[0];
                console.log('Usuario encontrado:', { ...user, password_hash: user.password_hash?.substring(0, 20) + '...' });
                
                showResult('🔄 Paso 2/4: Generando nuevo hash con la contraseña ingresada...', 'info');
                
                // Generar un nuevo hash con la contraseña ingresada
                const newHash = await bcrypt.hash(password, 10);
                console.log('Nuevo hash generado');
                
                showResult('🔄 Paso 3/4: Verificando hash actual...', 'info');
                
                // Verificar contraseña actual
                const passwordMatch = await bcrypt.compare(password, user.password_hash);
                console.log('Resultado verificación:', passwordMatch);
                
                showResult('🔄 Paso 4/4: Generando reporte detallado...', 'info');
                
                // Verificar si el hash es bcrypt válido
                const isValidBcrypt = user.password_hash?.startsWith('$2a$') || 
                                    user.password_hash?.startsWith('$2b$') || 
                                    user.password_hash?.startsWith('$2y$');
                
                let output = `🔍 ANÁLISIS COMPLETO DE CONTRASEÑA\n`;
                output += `═══════════════════════════════════════════\n\n`;
                output += `👤 USUARIO\n`;
                output += `   Nombre: ${user.name}\n`;
                output += `   Email: ${user.email}\n`;
                output += `   Role: ${user.role}\n`;
                output += `   ID: ${user.id}\n\n`;
                output += `🔐 HASH ACTUAL EN BASE DE DATOS\n`;
                output += `   ${user.password_hash}\n\n`;
                output += `   Longitud: ${user.password_hash?.length || 0} caracteres\n`;
                output += `   Formato: ${isValidBcrypt ? '✅ bcrypt válido' : '❌ NO es bcrypt válido'}\n\n`;
                output += `🔑 NUEVO HASH GENERADO (para comparar)\n`;
                output += `   ${newHash}\n\n`;
                output += `   Longitud: ${newHash.length} caracteres\n`;
                output += `   Formato: ✅ bcrypt válido\n\n`;
                output += `═══════════════════════════════════════════\n\n`;
                output += `🧪 RESULTADO DE LA VERIFICACIÓN\n`;
                output += `   ¿La contraseña coincide con el hash en BD?\n`;
                output += `   ${passwordMatch ? '✅ SÍ - COINCIDE PERFECTAMENTE' : '❌ NO - NO COINCIDE'}\n\n`;
                
                if (passwordMatch) {
                    output += `═══════════════════════════════════════════\n\n`;
                    output += `✅ ¡TODO ESTÁ PERFECTO!\n\n`;
                    output += `El hash en la BD es correcto y la contraseña coincide.\n`;
                    output += `Tu sistema de autenticación está funcionando bien.\n\n`;
                    output += `No hay ningún problema con este usuario.`;
                    showResult(output, 'success');
                } else {
                    output += `═══════════════════════════════════════════\n\n`;
                    output += `❌ PROBLEMA CONFIRMADO!\n\n`;
                    output += `El hash en la BD NO coincide con la contraseña ingresada.\n\n`;
                    
                    if (!isValidBcrypt) {
                        output += `🔴 PROBLEMA DETECTADO: El hash NO es bcrypt válido!\n\n`;
                        output += `Esto significa que:\n`;
                        output += `• La contraseña NO fue hasheada con bcrypt\n`;
                        output += `• O el hash está corrupto/incompleto\n`;
                        output += `• O fue hasheado con otro método\n\n`;
                    }
                    
                    output += `💡 SOLUCIONES POSIBLES:\n\n`;
                    output += `1️⃣ VERIFICA LA CONTRASEÑA\n`;
                    output += `   • ¿Estás usando la contraseña correcta?\n`;
                    output += `   • ¿No tiene espacios extras al inicio/final?\n`;
                    output += `   • ¿Está bien escrita (mayúsculas/minúsculas)?\n\n`;
                    output += `2️⃣ ACTUALIZA EL HASH EN SUPABASE\n`;
                    output += `   Ejecuta este SQL en Supabase:\n\n`;
                    output += `   UPDATE users\n`;
                    output += `   SET password_hash = '${newHash}'\n`;
                    output += `   WHERE email = '${email}';\n\n`;
                    output += `3️⃣ O REGISTRATE DE NUEVO\n`;
                    output += `   Crea un nuevo usuario desde la app de registro.`;
                    showResult(output, 'error');
                }
                
            } catch (error) {
                console.error('Error en verifyUserPassword:', error);
                showResult(`❌ Error al verificar:\n\n${error.message}\n\nStack: ${error.stack}\n\nRevisa la consola (F12) para más detalles.`, 'error');
            }
        }
    </script>
</body>
</html>
