<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Brevo Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
        }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 30px; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; display: block; }
        .info { background: #d1ecf1; color: #0c5460; border: 2px solid #bee5eb; display: block; }
        .warning { background: #fff3cd; color: #856404; border: 2px solid #ffc107; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Verificar Estado de Brevo</h1>
        <p>Comprueba el estado de tu cuenta y configuración de Brevo</p>
        
        <button onclick="checkBrevoAccount()">1️⃣ Verificar Cuenta de Brevo</button>
        <button onclick="checkSenderStatus()">2️⃣ Verificar Remitentes</button>
        <button onclick="getEmailStats()">3️⃣ Ver Estadísticas de Emails</button>
        
        <div id="result"></div>
    </div>

    <script>
        // IMPORTANTE: No subir la API key real a GitHub
        // Este archivo es solo para testing local
        const BREVO_API_KEY = 'TU_API_KEY_AQUI'; // Reemplaza con tu API key de .env.local

        function showResult(message, type = 'info') {
            const div = document.getElementById('result');
            div.className = type;
            div.textContent = message;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        async function checkBrevoAccount() {
            showResult('🔄 Verificando cuenta de Brevo...', 'info');
            
            try {
                const response = await fetch('https://api.brevo.com/v3/account', {
                    method: 'GET',
                    headers: {
                        'api-key': BREVO_API_KEY,
                        'accept': 'application/json'
                    }
                });

                console.log('Status:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(`Error ${response.status}: ${JSON.stringify(error)}`);
                }

                const data = await response.json();
                console.log('Account data:', data);
                
                let output = `✅ CUENTA DE BREVO\n\n`;
                output += `Email: ${data.email}\n`;
                output += `Plan: ${data.plan?.[0]?.type || 'Free'}\n`;
                output += `Créditos SMS: ${data.plan?.[0]?.credits || 0}\n\n`;
                
                if (data.relay && data.relay.enabled) {
                    output += `🔐 SMTP Relay: ✅ Activado\n`;
                    output += `Datos SMTP:\n`;
                    output += `  Host: ${data.relay.data?.relay || 'smtp-relay.brevo.com'}\n`;
                    output += `  Port: ${data.relay.data?.port || 587}\n\n`;
                }
                
                showResult(output, 'success');
                
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ ERROR\n\n${error.message}\n\nVerifica que la API Key sea correcta.`, 'error');
            }
        }

        async function checkSenderStatus() {
            showResult('🔄 Verificando remitentes...', 'info');
            
            try {
                const response = await fetch('https://api.brevo.com/v3/senders', {
                    method: 'GET',
                    headers: {
                        'api-key': BREVO_API_KEY,
                        'accept': 'application/json'
                    }
                });

                console.log('Status:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(`Error ${response.status}: ${JSON.stringify(error)}`);
                }

                const data = await response.json();
                console.log('Senders data:', data);
                
                if (!data.senders || data.senders.length === 0) {
                    showResult(`⚠️ NO HAY REMITENTES CONFIGURADOS\n\n` +
                        `Necesitas agregar un remitente verificado en Brevo.\n\n` +
                        `Ve a: https://app.brevo.com/settings/senders\n` +
                        `Y agrega tu email como remitente.`, 'warning');
                    return;
                }
                
                let output = `📧 REMITENTES CONFIGURADOS: ${data.senders.length}\n\n`;
                
                data.senders.forEach((sender, i) => {
                    output += `${i + 1}. ${sender.name} <${sender.email}>\n`;
                    output += `   Estado: ${sender.active ? '✅ Activo' : '❌ Inactivo'}\n`;
                    output += `   Verificado: ${sender.verified ? '✅ Sí' : '❌ No'}\n`;
                    output += `   ID: ${sender.id}\n\n`;
                });
                
                const hasVerified = data.senders.some(s => s.verified);
                
                if (!hasVerified) {
                    output += `⚠️ PROBLEMA DETECTADO:\n`;
                    output += `No tienes ningún remitente VERIFICADO.\n\n`;
                    output += `SOLUCIÓN:\n`;
                    output += `1. Ve a https://app.brevo.com/settings/senders\n`;
                    output += `2. Verifica tu email de remitente\n`;
                    output += `3. Revisa tu bandeja de entrada para el email de verificación`;
                }
                
                showResult(output, hasVerified ? 'success' : 'warning');
                
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ ERROR\n\n${error.message}`, 'error');
            }
        }

        async function getEmailStats() {
            showResult('🔄 Obteniendo estadísticas...', 'info');
            
            try {
                // Obtener emails enviados hoy
                const today = new Date();
                const startDate = today.toISOString().split('T')[0];
                
                const response = await fetch(`https://api.brevo.com/v3/smtp/statistics/events?limit=10&offset=0&startDate=${startDate}`, {
                    method: 'GET',
                    headers: {
                        'api-key': BREVO_API_KEY,
                        'accept': 'application/json'
                    }
                });

                console.log('Status:', response.status);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(`Error ${response.status}: ${JSON.stringify(error)}`);
                }

                const data = await response.json();
                console.log('Stats data:', data);
                
                let output = `📊 ESTADÍSTICAS DE EMAILS (Hoy)\n\n`;
                
                if (!data.events || data.events.length === 0) {
                    output += `No hay eventos de email registrados hoy.\n\n`;
                    output += `Esto puede significar:\n`;
                    output += `• Los emails no se están enviando\n`;
                    output += `• O aún no se han procesado\n`;
                } else {
                    output += `Total de eventos: ${data.events.length}\n\n`;
                    
                    data.events.slice(0, 5).forEach((event, i) => {
                        output += `${i + 1}. Email: ${event.email}\n`;
                        output += `   Evento: ${event.event}\n`;
                        output += `   Fecha: ${event.date}\n`;
                        output += `   Subject: ${event.subject || 'N/A'}\n`;
                        output += `   Message ID: ${event.messageId}\n\n`;
                    });
                }
                
                showResult(output, 'info');
                
            } catch (error) {
                console.error('Error:', error);
                showResult(`❌ ERROR\n\n${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
