<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obtener IDs de Tags - systeme.io</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 800px;
      width: 100%;
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .info-box {
      background: #e7f3ff;
      border: 2px solid #2196F3;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    #result {
      display: none;
    }
    
    .tag-item {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }
    
    .tag-name {
      font-weight: 600;
      color: #333;
      font-size: 18px;
      margin-bottom: 5px;
    }
    
    .tag-id {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      color: #667eea;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 5px;
    }
    
    .copy-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 5px 15px;
      border-radius: 4px;
      margin-left: 10px;
      cursor: pointer;
      font-size: 12px;
    }
    
    .copy-btn:hover {
      background: #218838;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
    }
    
    .error {
      background: #f8d7da;
      border: 2px solid #dc3545;
      color: #721c24;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
    
    .success {
      background: #d4edda;
      border: 2px solid #28a745;
      color: #155724;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏷️ Obtener IDs de Tags</h1>
    <p class="subtitle">Obtén los IDs de tus tags en systeme.io</p>

    <div class="info-box">
      <strong>📝 Instrucciones:</strong>
      <ol style="margin-top: 10px; padding-left: 20px; line-height: 1.8;">
        <li>Click en "Obtener Mis Tags"</li>
        <li>Se mostrarán todos tus tags con sus IDs</li>
        <li>Copia el ID del tag "curso-comprado"</li>
        <li>Pégalo en tu .env.local</li>
      </ol>
    </div>

    <button onclick="getTags()" id="getBtn">
      🔍 Obtener Mis Tags
    </button>

    <div id="result"></div>
  </div>

  <script>
    async function getTags() {
      const resultDiv = document.getElementById('result');
      const getBtn = document.getElementById('getBtn');
      
      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<div class="loading">⏳ Obteniendo tags de systeme.io...</div>';
      getBtn.disabled = true;

      try {
        const API_KEY = 'bn3r7ut2y7rytezrgdt2v050zwl4cjxqtnyzajh0n73ikwab092f7vfeehpqrvhy';

        console.log('🔑 Consultando API de systeme.io...');

        const response = await fetch('https://systeme.io/api/v2/tags', {
          method: 'GET',
          headers: {
            'Authorization': API_KEY,
            'Content-Type': 'application/json',
          }
        });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${await response.text()}`);
        }

        const data = await response.json();
        console.log('📊 Tags recibidos:', data);

        if (!data.items || data.items.length === 0) {
          resultDiv.innerHTML = `
            <div class="error">
              <strong>⚠️ No se encontraron tags</strong>
              <p style="margin-top: 10px;">
                Parece que no tienes tags creados aún en systeme.io.<br>
                Ve a: <strong>https://systeme.io/dashboard/tags</strong><br>
                Y crea el tag "curso-comprado"
              </p>
            </div>
          `;
          return;
        }

        // Mostrar todos los tags
        let html = '<div class="success"><strong>✅ Tags encontrados:</strong></div>';
        
        data.items.forEach(tag => {
          html += `
            <div class="tag-item">
              <div class="tag-name">🏷️ ${tag.name}</div>
              <div style="margin-top: 10px;">
                <strong>ID:</strong> 
                <span class="tag-id" id="tag-${tag.id}">${tag.id}</span>
                <button class="copy-btn" onclick="copyToClipboard('${tag.id}', 'tag-${tag.id}')">
                  📋 Copiar ID
                </button>
              </div>
              ${tag.name === 'curso-comprado' ? '<div style="margin-top:10px;color:#28a745;font-weight:600;">✅ Este es el tag que necesitas!</div>' : ''}
            </div>
          `;
        });

        html += `
          <div class="info-box" style="margin-top: 20px;">
            <strong>📝 Próximo paso:</strong>
            <ol style="margin-top: 10px; padding-left: 20px; line-height: 1.8;">
              <li>Copia el ID del tag "curso-comprado" (click en "📋 Copiar ID")</li>
              <li>Abre tu archivo .env.local</li>
              <li>Agrega: <code style="background:#f8f9fa;padding:2px 5px;">SYSTEME_TAG_ID=<strong>[el ID que copiaste]</strong></code></li>
              <li>Guarda el archivo</li>
              <li>¡Listo! ✅</li>
            </ol>
          </div>
        `;

        resultDiv.innerHTML = html;

      } catch (error) {
        console.error('❌ Error:', error);
        
        resultDiv.innerHTML = `
          <div class="error">
            <strong>❌ Error al obtener tags</strong>
            <p style="margin-top: 10px;">
              ${error.message}
            </p>
            <p style="margin-top: 10px;">
              <strong>Posibles soluciones:</strong>
            </p>
            <ol style="margin-top: 5px; padding-left: 20px; line-height: 1.8;">
              <li>Verifica que la API Key sea correcta</li>
              <li>Verifica que tengas tags creados en systeme.io</li>
              <li>Intenta obtener el ID manualmente desde la URL al editar el tag</li>
            </ol>
          </div>
        `;
      } finally {
        getBtn.disabled = false;
      }
    }

    function copyToClipboard(id, elementId) {
      navigator.clipboard.writeText(id).then(() => {
        const element = document.getElementById(elementId);
        const originalText = element.textContent;
        element.textContent = '✅ Copiado!';
        element.style.background = '#d4edda';
        element.style.color = '#155724';
        
        setTimeout(() => {
          element.textContent = originalText;
          element.style.background = 'white';
          element.style.color = '#667eea';
        }, 2000);

        alert(`✅ ID copiado: ${id}\n\nAhora pégalo en tu .env.local como:\nSYSTEME_TAG_ID=${id}`);
      }).catch(err => {
        alert('❌ Error al copiar. Selecciona el ID manualmente y cópialo.');
      });
    }
  </script>
</body>
</html>
