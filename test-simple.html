<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase - Simple</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: left;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
            display: block;
        }
        .loading {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Supabase</h1>
        <p>Verifica la conexión con tu base de datos</p>
        
        <div class="buttons">
            <button onclick="test1()">1️⃣ Test Conexión Básica</button>
            <button onclick="test2()">2️⃣ Test Leer Cursos</button>
            <button onclick="test3()">3️⃣ Test Leer Productos</button>
            <button onclick="test4()">4️⃣ Test Crear Usuario</button>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lhjzxwthuqpqsvqpvsxw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxoanp4d3RodXFwcXN2cXB2c3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDM0MDAsImV4cCI6MjA4NTcxOTQwMH0.wIbgZgFqvZXB0T-pF01TwHak-m3ZcDFa2LTBOdhim3E';

        function showResult(message, type = 'info') {
            const div = document.getElementById('result');
            div.className = type;
            div.textContent = message;
        }

        async function supabaseRequest(table, method = 'GET', body = null) {
            const url = `${SUPABASE_URL}/rest/v1/${table}${method === 'GET' ? '?select=*&limit=5' : ''}`;
            
            const options = {
                method: method,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                }
            };

            if (body && method === 'POST') {
                options.body = JSON.stringify(body);
            }

            const response = await fetch(url, options);
            const data = await response.json();
            
            return { response, data };
        }

        async function test1() {
            showResult('🔄 Probando conexión básica a Supabase...', 'loading');
            
            try {
                const { response, data } = await supabaseRequest('courses');
                
                if (response.ok) {
                    showResult(`✅ ¡CONEXIÓN EXITOSA!\n\n` +
                        `Status: ${response.status} ${response.statusText}\n` +
                        `URL: ${SUPABASE_URL}\n` +
                        `Tabla: courses\n\n` +
                        `Supabase está funcionando correctamente. 🎉`, 'success');
                } else {
                    showResult(`❌ Error al conectar:\n\n` +
                        `Status: ${response.status} ${response.statusText}\n` +
                        `Mensaje: ${data.message || data.error || 'Error desconocido'}\n\n` +
                        `Detalles:\n${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error de red:\n\n${error.message}\n\n` +
                    `No se pudo conectar a Supabase.\n` +
                    `Verificá tu conexión a internet.`, 'error');
            }
        }

        async function test2() {
            showResult('🔄 Leyendo cursos desde Supabase...', 'loading');
            
            try {
                const { response, data } = await supabaseRequest('courses');
                
                if (response.ok) {
                    if (Array.isArray(data) && data.length > 0) {
                        showResult(`✅ CURSOS OBTENIDOS EXITOSAMENTE!\n\n` +
                            `Total encontrados: ${data.length}\n\n` +
                            `Cursos:\n${data.map((c, i) => 
                                `${i + 1}. ${c.title} - $${c.price} (ID: ${c.id})`
                            ).join('\n')}\n\n` +
                            `Detalles completos:\n${JSON.stringify(data, null, 2)}`, 'success');
                    } else if (Array.isArray(data) && data.length === 0) {
                        showResult(`⚠️ NO HAY CURSOS EN LA BASE DE DATOS\n\n` +
                            `La tabla 'courses' está vacía.\n` +
                            `Necesitás agregar cursos desde el admin panel.`, 'info');
                    } else {
                        showResult(`⚠️ Respuesta inesperada:\n\n${JSON.stringify(data, null, 2)}`, 'info');
                    }
                } else {
                    showResult(`❌ Error al leer cursos:\n\n` +
                        `Status: ${response.status}\n` +
                        `Mensaje: ${data.message || data.error}\n\n` +
                        `Esto puede ser por las políticas RLS (Row Level Security).\n\n` +
                        `Detalles:\n${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error:\n\n${error.message}`, 'error');
            }
        }

        async function test3() {
            showResult('🔄 Leyendo productos desde Supabase...', 'loading');
            
            try {
                const { response, data } = await supabaseRequest('products');
                
                if (response.ok) {
                    if (Array.isArray(data) && data.length > 0) {
                        showResult(`✅ PRODUCTOS OBTENIDOS EXITOSAMENTE!\n\n` +
                            `Total encontrados: ${data.length}\n\n` +
                            `Productos:\n${data.map((p, i) => 
                                `${i + 1}. ${p.name} - $${p.price} (ID: ${p.id})`
                            ).join('\n')}\n\n` +
                            `Detalles completos:\n${JSON.stringify(data, null, 2)}`, 'success');
                    } else if (Array.isArray(data) && data.length === 0) {
                        showResult(`⚠️ NO HAY PRODUCTOS EN LA BASE DE DATOS\n\n` +
                            `La tabla 'products' está vacía.\n` +
                            `Necesitás agregar productos desde el admin panel.`, 'info');
                    } else {
                        showResult(`⚠️ Respuesta inesperada:\n\n${JSON.stringify(data, null, 2)}`, 'info');
                    }
                } else {
                    showResult(`❌ Error al leer productos:\n\n` +
                        `Status: ${response.status}\n` +
                        `Mensaje: ${data.message || data.error}\n\n` +
                        `Esto puede ser por las políticas RLS.\n\n` +
                        `Detalles:\n${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error:\n\n${error.message}`, 'error');
            }
        }

        async function test4() {
            showResult('🔄 Intentando crear usuario de prueba...', 'loading');
            
            const testUser = {
                email: `test_${Date.now()}@test.com`,
                password_hash: 'test_hash_12345',
                name: 'Usuario Test',
                role: 'user'
            };

            try {
                const { response, data } = await supabaseRequest('users', 'POST', testUser);
                
                if (response.ok || response.status === 201) {
                    showResult(`✅ USUARIO CREADO EXITOSAMENTE!\n\n` +
                        `Email: ${testUser.email}\n` +
                        `Nombre: ${testUser.name}\n\n` +
                        `Respuesta:\n${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    showResult(`❌ ERROR AL CREAR USUARIO:\n\n` +
                        `Status: ${response.status} ${response.statusText}\n` +
                        `Código: ${data.code}\n` +
                        `Mensaje: ${data.message || data.error}\n\n` +
                        `⚠️ ESTO ES NORMAL - Las políticas RLS están bloqueando la creación.\n` +
                        `Necesitamos ejecutar el script SQL para permitir operaciones públicas.\n\n` +
                        `Detalles técnicos:\n${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                showResult(`❌ Error:\n\n${error.message}`, 'error');
            }
        }

        // Auto-ejecutar test1 al cargar
        window.addEventListener('load', () => {
            setTimeout(test1, 500);
        });
    </script>
</body>
</html>
