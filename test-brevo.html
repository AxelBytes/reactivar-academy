<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Brevo Email</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; display: block; }
        .error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; display: block; }
        .info { background: #d1ecf1; color: #0c5460; border: 2px solid #bee5eb; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Test Brevo Email</h1>
        <p>Verifica que el servicio de emails esté funcionando</p>
        
        <div class="form-group">
            <label for="email">Email de prueba (tu email):</label>
            <input type="email" id="email" placeholder="tu@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="name">Tu nombre:</label>
            <input type="text" id="name" placeholder="Juan Pérez" required>
        </div>
        
        <button onclick="testBrevoEmail()">🚀 Enviar Email de Prueba</button>
        
        <div id="result"></div>
    </div>

    <script>
        function showResult(message, type = 'info') {
            const div = document.getElementById('result');
            div.className = type;
            div.textContent = message;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        async function testBrevoEmail() {
            const email = document.getElementById('email').value;
            const name = document.getElementById('name').value;
            
            if (!email || !name) {
                showResult('❌ Por favor completa todos los campos', 'error');
                return;
            }

            showResult('🔄 Enviando email de prueba via Brevo...', 'info');
            
            try {
                // Detectar si estamos en localhost o en producción
                const baseUrl = window.location.origin.includes('localhost') 
                    ? 'http://localhost:8080'
                    : window.location.origin;
                
                console.log('📡 Base URL:', baseUrl);
                console.log('📧 Enviando a:', email);
                
                const response = await fetch(`${baseUrl}/api/send-course-email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userEmail: email,
                        userName: name,
                        courses: [
                            {
                                title: '🧪 Curso de Prueba - Test Brevo',
                                instructor: 'Sistema de Testing'
                            }
                        ],
                        paymentId: 'TEST-' + Date.now(),
                        userDni: '12345678',
                        userProvincia: 'Buenos Aires',
                        userLocalidad: 'CABA',
                        userPais: 'Argentina'
                    })
                });

                console.log('📡 Status:', response.status);
                
                const data = await response.json();
                console.log('📦 Data:', data);
                
                if (!response.ok) {
                    throw new Error(data.error || data.details || `Error HTTP ${response.status}`);
                }

                showResult(`✅ EMAIL ENVIADO EXITOSAMENTE!\n\n` +
                    `Destinatario: ${email}\n` +
                    `Nombre: ${name}\n` +
                    `Email ID: ${data.emailId || 'N/A'}\n\n` +
                    `🎉 ¡Brevo está funcionando correctamente!\n\n` +
                    `Revisa tu bandeja de entrada (y spam) en:\n${email}`, 'success');
                
            } catch (error) {
                console.error('Error:', error);
                
                let errorMsg = `❌ ERROR AL ENVIAR EMAIL\n\n`;
                errorMsg += `Mensaje: ${error.message}\n\n`;
                
                if (error.message.includes('BREVO_API_KEY no configurada')) {
                    errorMsg += `PROBLEMA: La API Key de Brevo no está configurada.\n\n`;
                    errorMsg += `SOLUCIÓN:\n`;
                    errorMsg += `1. Verifica que existe el archivo .env.local\n`;
                    errorMsg += `2. Debe contener: BREVO_API_KEY=tu_api_key\n`;
                    errorMsg += `3. Reinicia el servidor (npm run dev)`;
                } else if (error.message.includes('401') || error.message.includes('unauthorized')) {
                    errorMsg += `PROBLEMA: La API Key de Brevo es inválida.\n\n`;
                    errorMsg += `SOLUCIÓN:\n`;
                    errorMsg += `1. Ve a https://app.brevo.com/\n`;
                    errorMsg += `2. Verifica tu API Key en Settings > API Keys\n`;
                    errorMsg += `3. Actualiza el .env.local con la key correcta`;
                } else if (error.message.includes('fetch')) {
                    errorMsg += `PROBLEMA: No se puede conectar con el servidor.\n\n`;
                    errorMsg += `SOLUCIÓN:\n`;
                    errorMsg += `1. Verifica que el servidor esté corriendo\n`;
                    errorMsg += `2. Debe estar en http://localhost:8080\n`;
                    errorMsg += `3. Ejecuta: npm run dev`;
                } else {
                    errorMsg += `Revisa la consola del navegador (F12) para más detalles.`;
                }
                
                showResult(errorMsg, 'error');
            }
        }
    </script>
</body>
</html>
