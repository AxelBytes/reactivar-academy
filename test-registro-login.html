<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registro y Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 700px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .alert {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            color: #856404;
        }
        .alert strong {
            display: block;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        button.secondary {
            background: #6c757d;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
            line-height: 1.6;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
            display: block;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
            display: block;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Registro y Login</h1>
        <p>Prueba el sistema de autenticación con tu usuario real</p>
        
        <div class="alert">
            <strong>⚠️ IMPORTANTE:</strong>
            Este test NO usa bcrypt (porque el CDN falla). 
            Usa la APP REAL en http://localhost:8080 para registrarte correctamente.
        </div>
        
        <div class="form-group">
            <label for="name">Nombre completo:</label>
            <input type="text" id="name" placeholder="Juan Pérez">
        </div>
        
        <div class="form-group">
            <label for="dni">DNI:</label>
            <input type="text" id="dni" placeholder="12345678">
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="tu@email.com">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Tu contraseña">
        </div>
        
        <div class="form-group">
            <label for="provincia">Provincia:</label>
            <input type="text" id="provincia" placeholder="Buenos Aires">
        </div>
        
        <div class="form-group">
            <label for="localidad">Localidad:</label>
            <input type="text" id="localidad" placeholder="CABA">
        </div>
        
        <div class="form-group">
            <label for="pais">País:</label>
            <input type="text" id="pais" placeholder="Argentina">
        </div>
        
        <button onclick="listarUsuarios()">📋 Ver Usuarios en BD</button>
        <button onclick="buscarMiUsuario()" class="secondary">🔍 Buscar Mi Usuario</button>
        <button onclick="irAApp()" style="background: #28a745;">🚀 Ir a la App para Registrarme</button>
        
        <div id="result"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lhjzxwthuqpqsvqpvsxw.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxoanp4d3RodXFwcXN2cXB2c3h3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDM0MDAsImV4cCI6MjA4NTcxOTQwMH0.wIbgZgFqvZXB0T-pF01TwHak-m3ZcDFa2LTBOdhim3E';

        function showResult(message, type = 'info') {
            const div = document.getElementById('result');
            div.className = type;
            div.textContent = message;
            console.log(`[${type.toUpperCase()}]`, message);
        }

        async function listarUsuarios() {
            showResult('🔄 Obteniendo usuarios...', 'info');
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?select=*&limit=50`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const users = await response.json();
                
                if (!users || users.length === 0) {
                    showResult(`⚠️ NO HAY USUARIOS EN LA BASE DE DATOS\n\n` +
                        `Necesitas registrarte desde la app en:\n` +
                        `http://localhost:8080/login`, 'info');
                    return;
                }

                let output = `✅ USUARIOS ENCONTRADOS: ${users.length}\n\n`;
                output += `═══════════════════════════════════════════\n\n`;
                
                users.forEach((user, i) => {
                    const isBcrypt = user.password_hash?.startsWith('$2a$') || 
                                   user.password_hash?.startsWith('$2b$') || 
                                   user.password_hash?.startsWith('$2y$');
                    
                    output += `${i + 1}. ${user.name || 'Sin nombre'}\n`;
                    output += `   Email: ${user.email}\n`;
                    output += `   DNI: ${user.dni || 'N/A'}\n`;
                    output += `   Provincia: ${user.provincia || 'N/A'}\n`;
                    output += `   Localidad: ${user.localidad || 'N/A'}\n`;
                    output += `   País: ${user.pais || 'N/A'}\n`;
                    output += `   Role: ${user.role}\n`;
                    output += `   Hash: ${isBcrypt ? '✅ bcrypt válido' : '❌ NO bcrypt (prueba)'}\n`;
                    output += `   ID: ${user.id}\n\n`;
                });
                
                output += `═══════════════════════════════════════════\n\n`;
                output += `💡 Los usuarios con hash "❌ NO bcrypt" son de prueba.\n`;
                output += `Solo los usuarios con "✅ bcrypt válido" pueden hacer login.`;
                
                showResult(output, 'success');
                
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function buscarMiUsuario() {
            const email = document.getElementById('email').value;
            
            if (!email) {
                showResult('❌ Por favor ingresa tu email', 'error');
                return;
            }

            showResult('🔄 Buscando tu usuario...', 'info');
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${email}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${await response.text()}`);
                }

                const users = await response.json();
                
                if (!users || users.length === 0) {
                    showResult(`❌ USUARIO NO ENCONTRADO\n\n` +
                        `Email: ${email}\n\n` +
                        `❌ NO ESTÁS REGISTRADO en la base de datos.\n\n` +
                        `═══════════════════════════════════════════\n\n` +
                        `🚀 SOLUCIÓN:\n\n` +
                        `1. Hace clic en el botón verde "Ir a la App"\n` +
                        `2. O abre: http://localhost:8080/login\n` +
                        `3. Ve a la pestaña "Registrarse"\n` +
                        `4. Completa el formulario con tus datos\n` +
                        `5. La app usará bcrypt para hashear tu contraseña\n` +
                        `6. Luego podrás hacer login correctamente\n\n` +
                        `═══════════════════════════════════════════`, 'error');
                    return;
                }

                const user = users[0];
                const isBcrypt = user.password_hash?.startsWith('$2a$') || 
                               user.password_hash?.startsWith('$2b$') || 
                               user.password_hash?.startsWith('$2y$');
                
                let output = `✅ USUARIO ENCONTRADO!\n\n`;
                output += `═══════════════════════════════════════════\n\n`;
                output += `👤 TUS DATOS\n\n`;
                output += `Nombre: ${user.name}\n`;
                output += `Email: ${user.email}\n`;
                output += `DNI: ${user.dni || 'N/A'}\n`;
                output += `Provincia: ${user.provincia || 'N/A'}\n`;
                output += `Localidad: ${user.localidad || 'N/A'}\n`;
                output += `País: ${user.pais || 'N/A'}\n`;
                output += `Role: ${user.role}\n\n`;
                output += `🔐 ESTADO DEL HASH\n\n`;
                output += `Tipo: ${isBcrypt ? '✅ bcrypt válido' : '❌ NO bcrypt (prueba)'}\n`;
                output += `Longitud: ${user.password_hash?.length || 0} caracteres\n`;
                output += `Hash: ${user.password_hash?.substring(0, 50)}...\n\n`;
                output += `═══════════════════════════════════════════\n\n`;
                
                if (isBcrypt) {
                    output += `✅ TU USUARIO ESTÁ CORRECTO!\n\n`;
                    output += `Tu contraseña está hasheada con bcrypt.\n`;
                    output += `Deberías poder hacer login en la app.\n\n`;
                    output += `Si no puedes, verifica:\n`;
                    output += `• Que estés usando la contraseña correcta\n`;
                    output += `• Que no tenga espacios extra al inicio/fin\n`;
                    output += `• Mayúsculas y minúsculas`;
                } else {
                    output += `❌ PROBLEMA: Hash NO es bcrypt válido\n\n`;
                    output += `Este usuario fue creado sin bcrypt (usuario de prueba).\n\n`;
                    output += `SOLUCIÓN:\n`;
                    output += `1. Registrate de nuevo desde la app\n`;
                    output += `2. Usa un email diferente (este ya existe)\n`;
                    output += `3. O elimina este usuario primero en Supabase`;
                }
                
                showResult(output, isBcrypt ? 'success' : 'error');
                
            } catch (error) {
                showResult(`❌ Error: ${error.message}`, 'error');
            }
        }

        function irAApp() {
            showResult('🚀 Abriendo la app en una nueva pestaña...', 'info');
            window.open('http://localhost:8080/login', '_blank');
        }
        
        // Mensaje inicial
        window.addEventListener('load', () => {
            showResult('✅ Sistema listo.\n\n' +
                '1. Primero usa "Ver Usuarios" para ver qué hay en la BD\n' +
                '2. Usa "Buscar Mi Usuario" para verificar si estás registrado\n' +
                '3. Si no estás, usa el botón verde para ir a registrarte', 'info');
        });
    </script>
</body>
</html>
