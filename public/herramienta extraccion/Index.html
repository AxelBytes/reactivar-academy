  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }

    /* ── Gradiente de fondo animado ── */
    .bg-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
    }
    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── Animaciones de pantalla ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-up   { animation: fadeUp   0.4s ease forwards; }
    .anim-fade-in   { animation: fadeIn   0.3s ease forwards; }
    .anim-slide-down{ animation: slideDown 0.3s ease forwards; }

    /* ── Stagger en tarjetas de resultados ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-in { animation: cardIn 0.25s ease forwards; }

    /* ── Skeleton shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 400px 100%;
      animation: shimmer 1.2s infinite linear;
      border-radius: 8px;
    }

    /* ── Toast ── */
    #toast-container { pointer-events: none; }
    .toast {
      pointer-events: auto;
      animation: slideDown 0.3s ease;
    }

    /* ── Input nativo sin zoom en iOS ── */
    input[type="text"],
    input[type="email"],
    input[type="password"] { font-size: 16px !important; }

    /* ── Scrollbar fina en modal ── */
    #modal-body::-webkit-scrollbar       { width: 4px; }
    #modal-body::-webkit-scrollbar-track { background: #f1f5f9; }
    #modal-body::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 99px; }

    /* ── Safe area para iPhone con notch ── */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
  </style>
</head>

  <!-- ═══════════════════════════════════════════════════
       JAVASCRIPT
  ═══════════════════════════════════════════════════ -->
  <script>
    // ── Estado ────────────────────────────────────────────────────────────────
    var sesion = { apiKey: '', nombre: '', diasRestantes: 0 };
    var articuloActivo = null;

    // ── Helper: verificar que google.script.run esté disponible ─────────────
    // Solo existe cuando el HTML es servido por Google Apps Script (HtmlService).
    // Si el archivo se abre directo en el navegador, esta API no existe.
    function gasDisponible() {
      return typeof google !== 'undefined' &&
             google.script &&
             typeof google.script.run !== 'undefined';
    }

    // ── Al cargar → verificar sesión guardada ────────────────────────────────
    window.addEventListener('load', function () {
      var keyGuardada = localStorage.getItem('buscador_key');

      // Limpiar si el valor guardado no tiene formato válido
      if (keyGuardada) keyGuardada = keyGuardada.trim();
      if (!keyGuardada || keyGuardada.length < 5) {
        localStorage.removeItem('buscador_key');
        return;
      }

      document.getElementById('input-clave').value = keyGuardada;
      // Esperar a que google.script.run esté inyectado antes de verificar
      setTimeout(function () { verificarClave(true); }, 1000);
    });

    document.getElementById('input-clave').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') verificarClave(false);
    });


    // ════════════════════════════════════════════════
    //  LOGIN
    // ════════════════════════════════════════════════

    function verificarClave(silencioso) {
      var clave = document.getElementById('input-clave').value.trim();
      if (!clave) {
        // No mostrar error si la llamada es silenciosa (auto-login al cargar)
        if (!silencioso) mostrarErrorLogin('Ingresá tu clave de acceso.');
        return;
      }

      // Verificar que google.script.run está disponible SOLO al hacer click,
      // no en el load (donde puede no estar listo todavía).
      if (!gasDisponible()) {
        mostrarErrorLogin(
          'Error de conexión con Google. ' +
          'Asegurate de abrir el link oficial y que no haya extensiones del navegador bloqueando scripts.'
        );
        return;
      }

      setBtnLogin(true);
      ocultarErrorLogin();

      google.script.run
        .withSuccessHandler(function (res) {
          setBtnLogin(false);
          if (res && res.valido) {
            sesion.apiKey        = clave;
            sesion.nombre        = res.nombre  || 'Cliente';
            sesion.diasRestantes = res.diasRestantes || 0;
            localStorage.setItem('buscador_key', clave);
            mostrarBuscador();
          } else {
            localStorage.removeItem('buscador_key');
            if (!silencioso) {
              mostrarErrorLogin(
                (res && res.mensaje) ? res.mensaje : 'Clave inválida o vencida.'
              );
            }
          }
        })
        .withFailureHandler(function (err) {
          setBtnLogin(false);
          if (!silencioso) {
            mostrarErrorLogin(
              'Error del servidor. Revisá que el script esté publicado correctamente.'
            );
          }
          console.error('GAS error:', err);
        })
        .verificarDesdeUI(clave);
    }

    function setBtnLogin(cargando) {
      document.getElementById('btn-ingresar').disabled = cargando;
      document.getElementById('btn-texto').textContent       = cargando ? 'Verificando…' : 'Ingresar';
      document.getElementById('btn-spin').style.display      = cargando ? 'block' : 'none';
    }

    function mostrarErrorLogin(msg) {
      var el = document.getElementById('login-error');
      document.getElementById('login-error-texto').textContent = msg;
      el.style.display = 'block';
    }

    function ocultarErrorLogin() {
      document.getElementById('login-error').style.display = 'none';
    }


    // ════════════════════════════════════════════════
    //  TRANSICIÓN LOGIN → BUSCADOR
    // ════════════════════════════════════════════════

    function mostrarBuscador() {
      var login    = document.getElementById('pantalla-login');
      var buscador = document.getElementById('pantalla-buscador');

      login.style.transition = 'opacity 0.3s ease';
      login.style.opacity    = '0';
      setTimeout(function () {
        login.style.display    = 'none';
        buscador.style.display = 'flex';
        document.getElementById('busqueda').focus();
      }, 300);

      // Info de sesión
      var dias  = sesion.diasRestantes;
      document.getElementById('user-nombre').textContent = sesion.nombre;
      document.getElementById('user-dias').textContent   =
        dias === 0  ? '⚠️ Vence hoy' :
        dias === 1  ? '⚠️ Vence mañana' :
        dias <= 5   ? '⚠️ ' + dias + ' días restantes' :
                      '✅ ' + dias + ' días restantes';
    }

    function cerrarSesion() {
      localStorage.removeItem('buscador_key');
      sesion = { apiKey: '', nombre: '', diasRestantes: 0 };
      document.getElementById('busqueda').value            = '';
      document.getElementById('resultados').innerHTML      = '';
      document.getElementById('contador').textContent      = '';
      document.getElementById('input-clave').value         = '';
      document.getElementById('pantalla-buscador').style.display = 'none';
      var login = document.getElementById('pantalla-login');
      login.style.opacity    = '0';
      login.style.display    = 'flex';
      requestAnimationFrame(function () {
        login.style.transition = 'opacity 0.3s ease';
        login.style.opacity    = '1';
      });
      mostrarToast('Sesión cerrada', 'info');
    }


    // ════════════════════════════════════════════════
    //  BUSCADOR
    // ════════════════════════════════════════════════

    function debounce(fn, ms) {
      var t;
      return function () {
        var a = arguments;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(null, a); }, ms);
      };
    }

    document.getElementById('busqueda').addEventListener('input', debounce(function (e) {
      var q = e.target.value.trim();
      if (q.length < 3) {
        document.getElementById('resultados').innerHTML = '';
        document.getElementById('contador').textContent = '';
        return;
      }

      if (!gasDisponible()) {
        mostrarToast('Error: entorno no válido', 'error');
        return;
      }

      mostrarSkeletons();
      document.getElementById('loader').classList.remove('hidden');

      google.script.run
        .withSuccessHandler(renderResultados)
        .withFailureHandler(function (err) {
          document.getElementById('loader').classList.add('hidden');
          mostrarToast('Error de conexión con el servidor', 'error');
          document.getElementById('resultados').innerHTML = '';
          console.error('Apps Script error:', err);
        })
        .buscarDesdeUI(q, sesion.apiKey);
    }, 300));

    function mostrarSkeletons() {
      var html = '';
      for (var i = 0; i < 4; i++) {
        html += '<div class="bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center gap-3">' +
                  '<div class="flex-1 space-y-2">' +
                    '<div class="skeleton h-3 w-1/3"></div>' +
                    '<div class="skeleton h-5 w-3/4"></div>' +
                  '</div>' +
                  '<div class="skeleton h-10 w-20 rounded-full shrink-0"></div>' +
                '</div>';
      }
      document.getElementById('resultados').innerHTML = html;
    }

    function renderResultados(res) {
      document.getElementById('loader').classList.add('hidden');
      var div = document.getElementById('resultados');
      div.innerHTML = '';

      if (!res || res.error || res.length === 0) {
        document.getElementById('contador').textContent = '';
        div.innerHTML =
          '<div class="text-center py-14">' +
            '<div class="text-5xl mb-3">🔍</div>' +
            '<p class="text-slate-500 font-semibold">Sin resultados</p>' +
            '<p class="text-slate-400 text-sm mt-1">Probá con otras palabras clave</p>' +
          '</div>';
        return;
      }

      document.getElementById('contador').textContent =
        res.length + ' resultado' + (res.length !== 1 ? 's' : '');

      res.forEach(function (item, idx) {
        var card = document.createElement('div');
        card.className = 'card-in bg-white rounded-2xl shadow-sm border border-slate-100 ' +
                         'active:bg-slate-50 transition-all cursor-pointer ' +
                         'hover:shadow-md hover:border-blue-100';
        card.style.animationDelay = (idx * 35) + 'ms';
        card.style.opacity = '0';

        card.innerHTML =
          '<div class="flex items-center justify-between gap-3 p-4">' +
            '<div class="flex-1 min-w-0">' +
              '<p class="text-xs font-bold uppercase tracking-wider text-blue-600 truncate mb-0.5">' +
                escHtml(item.capitulo) + '</p>' +
              '<h2 class="text-sm font-semibold text-slate-800 leading-snug line-clamp-2">' +
                '<span class="text-slate-400 mr-1">' + escHtml(item.articulo) + '</span>' +
                escHtml(item.titulo) +
              '</h2>' +
            '</div>' +
            '<div class="shrink-0 w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center">' +
              '<svg class="w-4 h-4 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>' +
              '</svg>' +
            '</div>' +
          '</div>';

        card.addEventListener('click', function () { abrirArticulo(item); });
        div.appendChild(card);
      });
    }


    // ════════════════════════════════════════════════
    //  MODAL
    // ════════════════════════════════════════════════

    function abrirArticulo(item) {
      articuloActivo = item;
      document.getElementById('modal-capitulo').textContent    = item.capitulo;
      document.getElementById('modal-titulo').textContent      = item.articulo + ' ' + item.titulo;
      document.getElementById('modal-contenido').textContent   = item.contenido;
      document.getElementById('modal-popular-count').textContent = item.popularidad || 0;
      document.getElementById('modal-body').scrollTop          = 0;

      var backdrop = document.getElementById('modal-backdrop');
      var modal    = document.getElementById('modal');
      var panel    = document.getElementById('modal-panel');
      backdrop.style.display = 'block';
      modal.style.display    = 'flex';
      requestAnimationFrame(function () {
        backdrop.classList.remove('opacity-0');
        backdrop.classList.add('opacity-100');
        panel.classList.remove('translate-y-full', 'md:translate-y-4', 'opacity-0');
        panel.classList.add('translate-y-0', 'opacity-100');
      });
      document.body.style.overflow = 'hidden';

      // Tracking asíncrono
      if (item.fila) {
        google.script.run
          .withSuccessHandler(function (r) {
            if (r && r.ok) document.getElementById('modal-popular-count').textContent = r.popularidad;
          })
          .withFailureHandler(function () {})
          .registrarDesdeUI(String(item.fila), sesion.apiKey);
      }
    }

    function cerrarModal() {
      var backdrop = document.getElementById('modal-backdrop');
      var panel    = document.getElementById('modal-panel');
      backdrop.classList.remove('opacity-100');
      backdrop.classList.add('opacity-0');
      panel.classList.remove('translate-y-0', 'opacity-100');
      panel.classList.add('translate-y-full', 'opacity-0');
      setTimeout(function () {
        backdrop.style.display = 'none';
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = '';
        articuloActivo = null;
      }, 300);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') cerrarModal();
    });


    // ════════════════════════════════════════════════
    //  COPIAR / COMPARTIR
    // ════════════════════════════════════════════════

    function copiarArticulo() {
      if (!articuloActivo) return;
      var t = articuloActivo.articulo + ' ' + articuloActivo.titulo + '\n' +
              articuloActivo.capitulo + '\n\n' + articuloActivo.contenido;
      navigator.clipboard.writeText(t).then(function () {
        mostrarToast('Artículo copiado al portapapeles', 'success');
      });
    }

    function compartirArticulo() {
      if (!articuloActivo) return;
      var data = {
        title: articuloActivo.articulo + ' ' + articuloActivo.titulo,
        text : articuloActivo.contenido.substring(0, 200) + '…',
        url  : window.location.href,
      };
      if (navigator.share) {
        navigator.share(data).catch(function () {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(function () {
          mostrarToast('Link copiado al portapapeles', 'success');
        });
      }
    }


    // ════════════════════════════════════════════════
    //  TOAST — notificaciones flotantes elegantes
    // ════════════════════════════════════════════════

    function mostrarToast(mensaje, tipo) {
      var estilos = {
        success: 'bg-green-600 text-white',
        error  : 'bg-red-600   text-white',
        info   : 'bg-slate-700 text-white',
      };
      var iconos = {
        success: '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>',
        error  : '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>',
        info   : '<path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>',
      };

      var toast = document.createElement('div');
      toast.className = 'toast flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl ' +
                        (estilos[tipo] || estilos.info);
      toast.innerHTML =
        '<svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">' +
          (iconos[tipo] || iconos.info) +
        '</svg>' +
        '<span class="text-sm font-medium">' + escHtml(mensaje) + '</span>';

      var container = document.getElementById('toast-container');
      container.appendChild(toast);

      setTimeout(function () {
        toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        toast.style.opacity    = '0';
        toast.style.transform  = 'translateY(-8px)';
        setTimeout(function () { toast.remove(); }, 300);
      }, 3000);
    }


    // ════════════════════════════════════════════════
    //  UTILIDAD
    // ════════════════════════════════════════════════

    function escHtml(s) {
      return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
  </script>

</body>
